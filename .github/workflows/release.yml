name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Tezgah.sln -c Release
      - run: dotnet publish src/Tezgah.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Tezgah-${{ github.ref_name }}-win-x64.zip
          (Get-FileHash Tezgah-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii Tezgah-${{ github.ref_name }}-win-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Tezgah-*-win-x64.zip
            Tezgah-*-win-x64.zip.sha256
          generate_release_notes: true
