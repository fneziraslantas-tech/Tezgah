name: Release

on:
  push:
    tags: ['v*']

# Least privilege: only the final job that publishes the release can write, and it runs no build or test code.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      # The tag is attacker-shaped input as far as a script is concerned: it reaches the shell only through env and only
      # after it matched vX.Y.Z (ASCII digits); later steps use the validated TEZGAH_VERSION, never github.ref_name.
      - name: Version from tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -cnotmatch '\Av([0-9]+\.[0-9]+\.[0-9]+)\z') { throw "Release tags must look like v1.2.3; got '$env:TAG'" }
          "TEZGAH_VERSION=$($Matches[1])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: "Restore (locked: packages.lock.json must match)"
        run: dotnet restore Tezgah.sln --locked-mode
      - run: dotnet test Tezgah.sln -c Release --no-restore
      # The locked restore above verified every locked package by content hash. A self-contained single-file publish
      # makes the SDK add an implicit Microsoft.NET.ILLink.Tasks reference whose version follows the SDK patch, so it
      # cannot be pinned in packages.lock.json; only this final build step relaxes locked mode to let it in (nothing reads the lock files afterwards).
      - name: Publish (self-contained single file)
        shell: pwsh
        run: dotnet publish src/Tezgah.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RestoreLockedMode=false "-p:Version=$env:TEZGAH_VERSION" -o out
      - name: Check the version baked into Tezgah.exe
        shell: pwsh
        run: ./.github/scripts/Assert-ExeVersion.ps1 -Exe out/Tezgah.exe -Expected $env:TEZGAH_VERSION
      - name: Zip and hash
        shell: pwsh
        run: |
          $zip = "Tezgah-v$env:TEZGAH_VERSION-win-x64.zip"
          Compress-Archive -Path out/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            Tezgah-*-win-x64.zip
            Tezgah-*-win-x64.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: Tezgah-*-win-x64.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Tezgah-*-win-x64.zip
            Tezgah-*-win-x64.zip.sha256
          generate_release_notes: true
