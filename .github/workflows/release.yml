name: Release

on:
  push:
    tags: ['v*']

# Least privilege: only the final job that publishes the release can write, and it runs no build or test code.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore (locked: packages.lock.json must match)
        run: dotnet restore Tezgah.sln --locked-mode
      - run: dotnet test Tezgah.sln -c Release --no-restore
      - run: dotnet publish src/Tezgah.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Tezgah-${{ github.ref_name }}-win-x64.zip
          (Get-FileHash Tezgah-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii Tezgah-${{ github.ref_name }}-win-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            Tezgah-*-win-x64.zip
            Tezgah-*-win-x64.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: Tezgah-*-win-x64.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Tezgah-*-win-x64.zip
            Tezgah-*-win-x64.zip.sha256
          generate_release_notes: true
